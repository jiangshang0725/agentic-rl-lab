[project]
name = "agentic-rl-lab-local"
version = "0.2.0"
description = "Local, inspectable reinforcement learning experiments for an 8 GB GPU"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.6.0",
    "transformers==4.51.3",
    "peft==0.15.2",
    "accelerate==1.6.0",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
cpu = ["torch==2.6.0"]
cuda = ["torch==2.6.0"]
datasets = ["datasets==3.5.0"]
plots = ["matplotlib>=3.8,<4"]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.8"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["local_rl/**/*.py", "tests/**/*.py"]
